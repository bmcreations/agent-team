<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1b1a" media="(prefers-color-scheme: dark)">
<title>agent-team</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<header class="top">
  <button id="menu" class="icon-btn narrow-only" type="button" aria-label="Show projects" aria-controls="side" aria-expanded="false">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <a href="#/" class="brand">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="10"/><circle cx="11" cy="12.5" r="4"/><circle cx="21" cy="12.5" r="4"/><circle cx="16" cy="21.5" r="4"/></svg>
    <span>agent-team</span>
  </a>
  <span id="conn" class="conn">Connecting</span>
  <span class="local">This machine only</span>
</header>
<div class="layout">
  <nav id="side" aria-label="Projects">
    <label class="search">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4"/></svg>
      <input id="search" type="search" placeholder="Search teammates, projects, tasks" aria-label="Search">
    </label>
    <a href="#/" id="home" class="nav-home">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h4l2-6 4 12 2-6h4"/></svg>
      Activity
    </a>
    <div id="projects"></div>
  </nav>
  <div id="scrim" hidden></div>
  <main>
    <section id="needs" aria-label="Needs you" hidden></section>
    <section id="view"></section>
  </main>
</div>
<p id="flash" role="status" aria-live="polite"></p>
</body>
</html>
